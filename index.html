<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เครื่องสร้างกรอบการ์ดเกรด</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&family=Prompt:wght@400;500;700&family=Sarabun:wght@400;500;700&family=Mitr:wght@400;500;700&family=Chonburi&family=Pridi:wght@400;500;700&family=Itim&family=Pattaya&family=Bai+Jamjuree:wght@400;500;700&family=Noto+Serif+Thai:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f5f7;--sf:#fff;--tx:#1b1d22;--mu:#6b7280;--bd:#d9dce2;--ac:#2f6df6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--sf:#1e2127;--tx:#eceef2;--mu:#9aa1ad;--bd:#343842;--ac:#6b9bff}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Thai","Sarabun",sans-serif}
h1{font-size:1.3rem;margin:0 0 4px}
.wrap{max-width:1000px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}
.sub{color:var(--mu);font-size:.85rem;margin:0 0 12px}
label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themes button{height:46px;border-radius:8px;border:2px solid var(--bd);cursor:pointer;font-size:.7rem;font-weight:600}
.themes button.on{border-color:var(--ac);outline:2px solid var(--ac)}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0 0;font-size:.85rem;color:var(--tx)}
.chk input{width:auto}
.btn{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stage{position:relative;max-width:420px;margin:0 auto;aspect-ratio:2/3;border-radius:16px;overflow:hidden;
background:repeating-conic-gradient(#c9ccd2 0 25%,#e9ebef 0 50%) 0 0/20px 20px}
.glare{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;mix-blend-mode:overlay}
.stage{transition:transform .12s ease-out}
.stage img{position:absolute;left:11%;top:19.333%;width:78%;height:72.8%;object-fit:cover;display:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
html,body{height:100%}
.wrap{height:100dvh;max-width:980px;padding:12px;gap:14px;grid-template-columns:minmax(0,1fr) 360px}
.card{display:flex;flex-direction:column;min-height:0;padding:12px}
h1{font-size:1.05rem}.sub{font-size:.74rem;margin:0 0 8px}
.stagebox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{height:100%;width:auto;max-width:100%;margin:0}
label{margin:7px 0 3px;font-size:.74rem}input,select{padding:6px 8px;font-size:.85rem}.row{gap:6px}
.themes button{height:38px}.btn{margin-top:8px;padding:9px}
.tabs{display:flex;gap:4px;margin-bottom:4px}
.tabs button{flex:1;padding:8px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--tx);font:inherit;font-size:.85rem;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pane{display:none}.pane.on{display:block}
.shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.6) 44%,rgba(120,200,255,.4) 50%,rgba(255,120,200,.4) 56%,transparent 68%) 0 0/300% 100%;animation:sweep 3.4s linear infinite}
@keyframes sweep{from{background-position:100% 0}to{background-position:0% 0}}
.tw{position:absolute;pointer-events:none;color:#fff;text-shadow:0 0 8px #fff,0 0 16px #8cf;opacity:0;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
@media(max-width:800px){.wrap{height:auto;display:block}.wrap .card{margin-bottom:12px}.stagebox{height:42dvh;flex:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>เครื่องสร้างกรอบการ์ดเกรด</h1>
    <p class="sub">เลือกลายป้ายชื่อ กรอกข้อมูล แล้วโหลดเป็น PNG โปร่งใสไปวางทับภาพการ์ดได้เลย ช่องใส่การ์ดจะโปร่งใสทั้งหมด (สัดส่วนช่องการ์ด 5:7)</p>
    <div class="stagebox"><div class="stage" id="stage"><img id="cardimg" alt=""><canvas id="cv" width="2000" height="3000"></canvas><div class="glare" id="glare"></div></div></div>
  </div>

  <div class="card">
    <div class="tabs" id="tabs"><button class="on" data-t="0">ข้อมูล</button><button data-t="1">ป้ายชื่อ</button><button data-t="2">สลาบ</button><button data-t="3">โฮโล ✨</button></div>
    <div class="pane on" data-p="0">
      <label>ชื่อบริษัทเกรด (ใส่ชื่อสมมติได้)</label><input id="co" value="Namjit Grading">
      <label>บรรทัด 1 (ปี / ชุด)</label><input id="l1" value="2017 Starburst Stream">
      <label>บรรทัด 2 (ชื่อการ์ด)</label><input id="l2" value="NJ NAMJIT">
      <label>บรรทัด 3 (เลขการ์ด / แรร์ริตี้)</label><input id="l3" value="#001 · Ultra Rare">
      <div class="row"><div><label>เกรด</label><select id="gr"></select></div><div><label>เลขใบรับรอง</label><input id="cert" value="12345678"></div></div>
      <div class="row"><div><label>ภาษาข้อความเกรด</label><select id="gtl"><option value="en">อังกฤษ</option><option value="th">ไทย</option></select></div><div><label>ข้อความเกรด</label><input id="gt" value="GEM MT"></div></div>
    </div>
    <div class="pane" data-p="1">
      <label style="margin-top:0">ลายป้ายชื่อ</label><div class="themes" id="themes"></div>
      <div class="row"><div><label>ลวดลายป้าย</label><select id="pat"><option value="0">ไม่มี</option><option value="stripe">ทแยง</option><option value="dot">จุด</option><option value="wave">คลื่น</option><option value="carbon">คาร์บอน</option></select></div>
      <div><label>ตราโฮโลแกรม</label><select id="seal"><option value="0">ไม่มี</option><option value="1">มี ★</option></select></div></div>
      <div class="row"><div><label>ขอบป้าย</label><select id="lb"><option value="0">ไม่มี</option><option value="gold">ทอง</option><option value="silver">เงิน</option><option value="black">ดำ</option></select></div>
      <div><label>ฟอยล์เงาบนป้าย</label><select id="foil"><option value="0">ไม่มี</option><option value="1">มี</option></select></div></div>
      <div class="row"><div><label>ฟอนต์ป้าย</label><select id="font"><option value="sans">เรียบกระชับ</option><option value="serif">หรูหรา (Serif)</option><option value="mono">เทค (Mono)</option><option value="round">มนน่ารัก</option><optgroup label="ฟอนต์ไทย"><option value="kanit">Kanit (ทันสมัย)</option><option value="prompt">Prompt (เรียบสะอาด)</option><option value="sarabun">Sarabun (อ่านง่าย ทางการ)</option><option value="mitr">Mitr (หนามนกลม)</option><option value="chonburi">Chonburi (หัวข้อหรู)</option><option value="pridi">Pridi (เซอริฟไทย)</option><option value="notoserif">Noto Serif Thai (คลาสสิก)</option><option value="itim">Itim (ลายมือ)</option><option value="pattaya">Pattaya (น่ารัก)</option><option value="bai">Bai Jamjuree (เทคโนโลยี)</option></optgroup></select></div>
      <div><label>รูปทรงโลโก้</label><select id="logo"><option value="circle">วงกลม</option><option value="shield">โล่</option><option value="diamond">เพชร</option><option value="hex">หกเหลี่ยม</option><option value="star">ดาว</option></select></div></div>
    </div>
    <div class="pane" data-p="2">
      <div class="row"><div><label>สีพลาสติก</label><select id="tint"><option value="clear">ใส</option><option value="smoke">ควัน</option><option value="warm">ครีม</option><option value="blue">ฟ้าใส</option><option value="pink">ชมพูใส</option><option value="purple">ม่วงใส</option><option value="gold">ทองใส</option></select></div>
      <div><label>เงาสะท้อน</label><select id="gloss"><option value="0">ไม่มี</option><option value="1" selected>เฉพาะขอบ</option><option value="2">ทับการ์ดด้วย</option><option value="3">ลำแสงพาดเฉียง</option></select></div></div>
      <div class="row"><div><label>ขอบเรืองแสง</label><select id="edge"><option value="0">ไม่มี</option><option value="gold">ทอง</option><option value="blue">ฟ้านีออน</option><option value="pink">ชมพู</option><option value="rainbow">สายรุ้ง</option></select></div>
      <div><label>กรอบช่องการ์ด</label><select id="rim"><option value="dark">ดำ</option><option value="gold">ทอง</option><option value="silver">เงิน</option><option value="pink">ชมพู</option><option value="rainbow">สายรุ้ง</option></select></div></div>
      <div class="row"><div><label>รอยขีดข่วน</label><select id="scr"><option value="0">ไม่มี</option><option value="1" selected>เบา</option><option value="2">เยอะ</option></select></div>
      <div><label>ประกายดาว</label><select id="spark"><option value="0">ไม่มี</option><option value="1">มี</option></select></div></div>
      <div class="row"><div><label>มุมประดับ</label><select id="corner"><option value="0">ไม่มี</option><option value="gold">ทอง</option><option value="silver">เงิน</option></select></div>
      <div><label>พื้นหลังตัวอย่าง</label><select id="bg"><option value="checker">โปร่งใส</option><option value="dark">ดำ</option><option value="light">ขาว</option><option value="grad">ไล่สีสด</option><option value="felt">โต๊ะสักหลาด</option></select></div></div>
      <label>ข้อความใต้การ์ด (เว้นว่างได้)</label><input id="cap" value="AUTHENTIC · GRADED">
      <label>ภาพการ์ดของคุณ (ไม่บังคับ ใช้ดูตัวอย่าง)</label><input type="file" id="file" accept="image/*">
    </div>
    <div class="pane" data-p="3">
      <div class="row"><div><label>ลายโฮโลแกรมทั่วสลาบ</label><select id="holo"><option value="0">ไม่มี</option><option value="rainbow">สายรุ้งไล่สี</option><option value="prism">ปริซึมทแยง</option><option value="lattice">ตาข่ายเพชร</option><option value="oil">น้ำมันสะท้อนแสง</option></select></div>
      <div><label>คลุมช่องการ์ดด้วย</label><select id="hcov"><option value="0">ไม่คลุม</option><option value="1">คลุม</option></select></div></div>
      <label>ความเข้ม <span id="hv">55</span>%</label><input type="range" id="hint" min="10" max="100" value="55" style="padding:0">
      <div class="row"><div><label>กลิตเตอร์</label><select id="glit"><option value="0">ไม่มี</option><option value="1">น้อย</option><option value="2">เยอะ</option></select></div>
      <div><label>แฟลร์วิ๊งวับ</label><select id="flare"><option value="0">ไม่มี</option><option value="1">ไม่กี่จุด</option><option value="2">เยอะ</option></select></div></div>
      <label>แอนิเมชันในภาพตัวอย่าง (ไม่ติดไปกับไฟล์)</label><select id="anim"><option value="0">ปิด</option><option value="1">แสงกวาด</option><option value="2" selected>แสงกวาด + ประกายระยับ</option></select>
    </div>
    <button class="btn" id="dl">โหลดกรอบ PNG (โปร่งใส)</button>
    <button class="btn alt" id="dl2" disabled>โหลดภาพรวมการ์ด + กรอบ</button>
    <div class="row"><button class="btn alt" id="gif">โหลด GIF ✨</button><button class="btn alt" id="vid">โหลดวิดีโอ ✨</button></div>
  </div>
</div>

<script>
const W=1000,H=1500,S=2,WIN={x:110,y:290,w:780,h:1092};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const THEMES=[
 {n:'คลาสสิกแดง',bg:['#ffffff','#e9ecf0'],tx:'#111',ac:'#c8102e',box:['#d8213f','#a50d26'],bt:'#fff'},
 {n:'ดำทอง',bg:['#141418','#2b2b33'],tx:'#f3e7c3',ac:'#d4af37',box:['#f3d675','#b8902a'],bt:'#1a1405'},
 {n:'น้ำเงินเข้ม',bg:['#0b2a5b','#154694'],tx:'#fff',ac:'#7fb4ff',box:['#ffffff','#d6e4ff'],bt:'#0b2a5b'},
 {n:'เขียวมิ้นต์',bg:['#f4fcf8','#d9f2e6'],tx:'#0d3b2b',ac:'#0f8a5f',box:['#17a874','#0f8a5f'],bt:'#fff'},
 {n:'โฮโลแกรม',bg:['#f1ecff','#e3f6ff'],tx:'#1a1a2e',ac:'#6a4cff',box:['#7b5cff','#3d8bff'],bt:'#fff',holo:1},
 {n:'ชมพูพาสเทล',bg:['#fff1f7','#ffd5e7'],tx:'#4a1330',ac:'#e0407f',box:['#ef5b94','#d02f6f'],bt:'#fff'}
];
const GR={10:'GEM MT',9.5:'GEM MT',9:'MINT',8.5:'NM-MT+',8:'NM-MT',7:'NEAR MINT',6:'EX-MT',5:'EXCELLENT',4:'VG-EX',3:'VERY GOOD',2:'GOOD',1:'POOR'};
let cur=0,card=null;

THEMES.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.n;
 b.style.background=`linear-gradient(135deg,${t.bg[0]},${t.bg[1]})`;b.style.color=t.tx;
 b.onclick=()=>{cur=i;mark();draw()};$('themes').appendChild(b)});
function mark(){[...$('themes').children].forEach((b,i)=>b.classList.toggle('on',i===cur))}
Object.keys(GR).sort((a,b)=>b-a).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;$('gr').appendChild(o)});
const GRT={10:'สมบูรณ์แบบ',9.5:'สมบูรณ์แบบ',9:'ยอดเยี่ยม',8.5:'ดีเยี่ยม+',8:'ดีเยี่ยม',7:'ดีมาก',6:'ดี+',5:'ดี',4:'พอใช้+',3:'พอใช้',2:'ค่อนข้างแย่',1:'แย่'};
const setGT=()=>{$('gt').value=($('gtl').value==='th'?GRT:GR)[$('gr').value];draw()};
$('gr').onchange=setGT;$('gtl').onchange=setGT;

function rr(c,x,y,w,h,r){c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fit(c,t,max,size,wt){let s=size;c.font=`${wt} ${s}px ${FF()}`;
 while(c.measureText(t).width>max&&s>12){s-=1;c.font=`${wt} ${s}px ${FF()}`}}
function lg(c,x0,y0,x1,y1,cols){const g=c.createLinearGradient(x0,y0,x1,y1);cols.forEach((k,i)=>g.addColorStop(i/(cols.length-1),k));return g}

function frame(c){
 const tint=$('tint').value,gl=$('gloss').value,T=THEMES[cur];
 c.setTransform(S,0,0,S,0,0);c.clearRect(0,0,W,H);
 const fills={clear:'rgba(232,240,248,0.34)',smoke:'rgba(70,76,90,0.42)',warm:'rgba(250,240,215,0.40)',blue:'rgba(140,195,255,.40)',pink:'rgba(255,185,215,.40)',purple:'rgba(195,165,255,.40)',gold:'rgba(255,214,120,.40)'};
 // body
 c.beginPath();rr(c,0,0,W,H,40);rr(c,WIN.x,WIN.y,WIN.w,WIN.h,8);c.fillStyle=fills[tint];c.fill('evenodd');
 c.lineWidth=5;c.strokeStyle='rgba(255,255,255,.8)';c.beginPath();rr(c,2.5,2.5,W-5,H-5,38);c.stroke();
 c.lineWidth=2;c.strokeStyle='rgba(0,0,0,.18)';c.beginPath();rr(c,14,14,W-28,H-28,28);c.stroke();bevel(c);
 // inner holder
 c.beginPath();rr(c,60,262,880,1182,18);rr(c,WIN.x,WIN.y,WIN.w,WIN.h,8);c.fillStyle='rgba(255,255,255,.22)';c.fill('evenodd');
 c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.3)';c.beginPath();rr(c,60,262,880,1182,18);c.stroke();
 c.lineWidth=4;c.strokeStyle=$('rim').value==='rainbow'?lg(c,WIN.x,WIN.y,WIN.x+WIN.w,WIN.y+WIN.h,['#ff5fa8','#ffb35f','#fff25f','#5fffa8','#5fc8ff','#a85fff']):RIM[$('rim').value];c.beginPath();rr(c,WIN.x-2,WIN.y-2,WIN.w+4,WIN.h+4,10);c.stroke();
 c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.7)';c.beginPath();rr(c,WIN.x-8,WIN.y-8,WIN.w+16,WIN.h+16,14);c.stroke();
 texture(c);depth(c);slot(c);label(c,T);
 // gloss
 if(gl!=='0'){c.save();c.beginPath();rr(c,0,0,W,H,40);
  if(gl==='1')rr(c,WIN.x,WIN.y,WIN.w,WIN.h,8);
  c.clip(gl==='1'?'evenodd':'nonzero');
  const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(.3,'rgba(255,255,255,.03)');
  g.addColorStop(.42,'rgba(255,255,255,.14)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.12)');
  c.fillStyle=g;c.fillRect(0,0,W,H);c.restore()}extras(c);
}

const RIM={dark:'rgba(0,0,0,.45)',gold:'#d9b34a',silver:'#cfd3da',pink:'#ff6fa8'};
function rnd(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function bevel(c){
 c.save();c.beginPath();rr(c,0,0,W,H,40);rr(c,WIN.x,WIN.y,WIN.w,WIN.h,8);c.clip('evenodd');
 c.lineWidth=18;c.strokeStyle=lg(c,0,0,W,H,['rgba(255,255,255,.75)','rgba(255,255,255,.05)','rgba(0,0,0,.28)']);
 c.beginPath();rr(c,0,0,W,H,40);c.stroke();
 c.lineWidth=2;c.setLineDash([10,8]);c.strokeStyle='rgba(255,255,255,.4)';c.beginPath();rr(c,36,36,W-72,H-72,22);c.stroke();
 c.restore();
 c.lineWidth=3;c.strokeStyle=lg(c,60,262,940,1444,['rgba(255,255,255,.85)','rgba(255,255,255,0)','rgba(0,0,0,.35)']);
 c.beginPath();rr(c,64,266,872,1174,16);c.stroke();
}
function depth(c){
 const {x,y,w,h}=WIN;c.save();c.beginPath();rr(c,x,y,w,h,8);c.clip();
 let g=c.createLinearGradient(0,y,0,y+46);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x,y,w,46);
 g=c.createLinearGradient(x,0,x+34,0);g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x,y,34,h);
 g=c.createLinearGradient(x+w-14,0,x+w,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.2)');c.fillStyle=g;c.fillRect(x+w-14,y,14,h);
 c.restore();
}
function texture(c){
 const r=rnd(7);c.save();c.beginPath();rr(c,0,0,W,H,40);rr(c,WIN.x,WIN.y,WIN.w,WIN.h,8);c.clip('evenodd');
 for(let i=0;i<2500;i++){c.fillStyle='rgba(255,255,255,'+(r()*.12)+')';c.fillRect(r()*W,r()*H,1+r()*1.5,1+r()*1.5)}
 c.restore();
}
function extras(c){
 if($('gloss').value==='3'){c.save();c.beginPath();rr(c,0,0,W,H,40);c.clip();const g=c.createLinearGradient(150,0,850,1500);

   const r=Math.min(5,Math.max(0,Math.round(R/51+t))),g=Math.min(6,Math.max(0,Math.round(G/42.5+t))),b=Math.min(5,Math.max(0,Math.round(V/51+t)));idx[i]=(r*7+g)*6+b}
  parts.push(new Uint8Array([0x21,0xF9,4,tr?0x09:0x04,8,0,tr?252:0,0,0x2C,0,0,0,0,w&255,w>>8,h&255,h>>8,0,8]),sub(lzw(idx)))}

async function exportVideo(prog){
 const w=1080,h=1620,c2=document.createElement('canvas');c2.width=w;c2.height=h;const x=c2.getContext('2d');
 const mt=window.MediaRecorder&&['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
 if(!mt){alert('เบราว์เซอร์นี้ไม่รองรับการอัดวิดีโอ ลองใช้ Chrome หรือ Safari รุ่นใหม่ หรือโหลด GIF แทน');return}
 renderFrame(x,w,h,0);const rec=new MediaRecorder(c2.captureStream(30),{mimeType:mt,videoBitsPerSecond:8e6}),ch=[];
 rec.ondataavailable=e=>e.data.size&&ch.push(e.data);const done=new Promise(r=>rec.onstop=r);rec.start();
 const t0=performance.now(),DUR=6000;
 await new Promise(res=>{const tick=()=>{const e=performance.now()-t0;renderFrame(x,w,h,(e%3000)/3000);prog(Math.min(6,Math.ceil(e/1000)));if(e<DUR)requestAnimationFrame(tick);else res()};tick()});
 rec.stop();await done;dl(new Blob(ch,{type:mt.split(';')[0]}),'graded-card.'+(mt.includes('mp4')?'mp4':'webm'))}
